<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 324" width="720" height="324" role="img" aria-label="The decision rule almost never scales a bet that does not work"><style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
        --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --base:#0b0b0b; --up:#e34948; --down:#2a78d6; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835;
          --s1:#3987e5; --s2:#d95926; --s3:#199e70; --base:#ffffff; --up:#e66767; --down:#3987e5; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 12px; }
  .title { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .muted { fill: var(--muted); font-size: 11px; }
  .val { fill: var(--ink); font-variant-numeric: tabular-nums; paint-order: stroke; stroke: var(--surface);
         stroke-width: 4px; stroke-linejoin: round; }
  .inbar { fill: #ffffff; font-weight: 600; font-variant-numeric: tabular-nums; }
</style><rect width="720" height="324" rx="8" fill="var(--surface)"/><text class="title" x="24" y="34">The decision rule almost never scales a bet that does not work</text><text x="24" y="56">Share of 200 simulated tests ending in each decision, by true uplift</text><rect x="24" y="78" width="12" height="12" rx="2" fill="var(--s3)"/><text x="42" y="88">Scale</text><rect x="194" y="78" width="12" height="12" rx="2" fill="var(--s1)"/><text x="212" y="88">Iterate</text><rect x="364" y="78" width="12" height="12" rx="2" fill="var(--muted)"/><text x="382" y="88">Stop or redesign</text><rect x="534" y="78" width="12" height="12" rx="2" fill="var(--s2)"/><text x="552" y="88">Do not scale</text><text x="188" y="139" text-anchor="end">No real uplift</text><rect x="200.0" y="124" width="19.2" height="24" fill="var(--s1)"><title>No real uplift: Iterate 4%</title></rect><rect x="219.2" y="124" width="458.4" height="24" fill="var(--muted)"><title>No real uplift: Stop or redesign 96%</title></rect><text class="inbar" x="448.4" y="141" text-anchor="middle">96%</text><rect x="677.6" y="124" width="2.4" height="24" fill="var(--s2)"><title>No real uplift: Do not scale 0%</title></rect><text x="188" y="185" text-anchor="end">At break-even</text><rect x="200.0" y="170" width="213.6" height="24" fill="var(--s3)"><title>At break-even: Scale 44%</title></rect><text class="inbar" x="306.8" y="187" text-anchor="middle">44%</text><rect x="413.6" y="170" width="129.6" height="24" fill="var(--s1)"><title>At break-even: Iterate 27%</title></rect><text class="inbar" x="478.4" y="187" text-anchor="middle">27%</text><rect x="543.2" y="170" width="115.2" height="24" fill="var(--muted)"><title>At break-even: Stop or redesign 24%</title></rect><text class="inbar" x="600.8" y="187" text-anchor="middle">24%</text><rect x="658.4" y="170" width="21.6" height="24" fill="var(--s2)"><title>At break-even: Do not scale 4%</title></rect><text x="188" y="231" text-anchor="end">At plan (1% a year)</text><rect x="200.0" y="216" width="376.8" height="24" fill="var(--s3)"><title>At plan (1% a year): Scale 78%</title></rect><text class="inbar" x="388.4" y="233" text-anchor="middle">78%</text><rect x="576.8" y="216" width="62.4" height="24" fill="var(--s1)"><title>At plan (1% a year): Iterate 13%</title></rect><text class="inbar" x="608.0" y="233" text-anchor="middle">13%</text><rect x="639.2" y="216" width="12.0" height="24" fill="var(--muted)"><title>At plan (1% a year): Stop or redesign 2%</title></rect><rect x="651.2" y="216" width="28.8" height="24" fill="var(--s2)"><title>At plan (1% a year): Do not scale 6%</title></rect><text x="188" y="277" text-anchor="end">Strong (1.5% a year)</text><rect x="200.0" y="262" width="451.2" height="24" fill="var(--s3)"><title>Strong (1.5% a year): Scale 94%</title></rect><text class="inbar" x="425.6" y="279" text-anchor="middle">94%</text><rect x="651.2" y="262" width="28.8" height="24" fill="var(--s2)"><title>Strong (1.5% a year): Do not scale 6%</title></rect></svg>
